services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: alertaarroyo
      POSTGRES_PASSWORD: alertaarroyo
      POSTGRES_DB: alertaarroyo
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U alertaarroyo"], interval: 3s, retries: 20 }
  web:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      APP_SECRET: ${APP_SECRET:-cambiar-esta-clave}
      ADMIN_CORREO: ${ADMIN_CORREO:-admin@alertaarroyo.local}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-Admin12345}
    ports: ["3000:3000"]
    volumes: [uploads:/app/uploads]
volumes: { dbdata: {}, uploads: {} }
